
name: C++ Compile

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile C++
        run: g++ -std=c++17 tugas_4.cpp -o tugas_4

      - name: Run Program
        run: echo 8 | ./tugas_4
